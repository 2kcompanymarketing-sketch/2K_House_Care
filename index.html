<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>2K House Care • 2026</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: #eef7fb;
      color: #111;
      overflow-x: hidden;
    }

    /* =========================================================
       HERO
       ========================================================= */

    .hero {
      position: relative;
      width: 100vw;
      height: 100svh;
      min-height: 720px;
      overflow: hidden;
      isolation: isolate;
      background: #edf6fb;
    }

    /* Исходный Laundry-визуал */
    .hero-photo {
      position: absolute;
      inset: -1.5%;
      z-index: 0;

      background-image: url("assets/hero-laundry.png");
      background-size: cover;
      background-position: 58% center;

      filter: saturate(1.06) contrast(1.015);
      transform: scale(1.025);

      animation: photoBreath 15s ease-in-out infinite alternate;
      will-change: transform;
    }

    @keyframes photoBreath {
      from {
        transform: scale(1.025) translate3d(0,0,0);
      }

      to {
        transform: scale(1.055) translate3d(-0.4%,-0.25%,0);
      }
    }

    /* =========================================================
       СВЕТЛАЯ ЗОНА СЛЕВА
       Закрывает старые белые надписи внутри hero-laundry.png
       ========================================================= */

    .left-mask {
      position: absolute;
      z-index: 2;
      inset: 0 auto 0 0;

      width: 45.5vw;
      min-width: 630px;

      background:
        linear-gradient(
          90deg,
          rgba(239,248,252,1) 0%,
          rgba(238,248,252,.99) 54%,
          rgba(235,246,252,.92) 73%,
          rgba(231,244,251,.50) 88%,
          rgba(231,244,251,0) 100%
        );

      pointer-events: none;
    }

    .left-mask::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at 20% 35%,
          rgba(255,255,255,.70),
          transparent 47%
        );
    }

    /* =========================================================
       ИГРА СВЕТА
       ========================================================= */

    .light {
      position: absolute;
      inset: 0;
      z-index: 4;
      overflow: hidden;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .light::before {
      content: "";
      position: absolute;

      width: 45vw;
      height: 135vh;

      left: 47vw;
      top: -25vh;

      transform: rotate(8deg);

      background:
        linear-gradient(
          110deg,
          transparent 20%,
          rgba(255,255,255,.05) 34%,
          rgba(255,255,255,.46) 49%,
          rgba(176,227,255,.17) 57%,
          transparent 73%
        );

      filter: blur(17px);

      animation: lightMove 8s ease-in-out infinite alternate;
    }

    @keyframes lightMove {
      from {
        transform: translateX(-7vw) rotate(8deg);
        opacity: .45;
      }

      to {
        transform: translateX(11vw) rotate(8deg);
        opacity: .95;
      }
    }

    /* =========================================================
       КОНТЕНТ
       ========================================================= */

    .content {
      position: relative;
      z-index: 20;
      width: 100%;
      height: 100%;
    }

    /* настоящий 2K */
    .logo-2k {
      position: absolute;

      left: 4.8vw;
      top: 5.1vh;

      width: clamp(92px, 6.5vw, 126px);
      height: auto;

      display: block;
      object-fit: contain;

      filter: grayscale(1) brightness(0);
    }

    /* HOUSE CARE */
    .category {
      position: absolute;

      left: 4.8vw;
      top: 36.5vh;

      display: flex;
      align-items: center;
      gap: 15px;

      font-size: clamp(19px, 1.5vw, 28px);
      line-height: 1;

      font-weight: 600;
      letter-spacing: .18em;

      color: #111;

      white-space: nowrap;
    }

    .dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;
      background: #111;

      flex: none;
    }

    /* НОВИНКИ */
    .title {
      position: absolute;

      left: 4.55vw;
      top: 45.6vh;

      font-family: "Playfair Display", Georgia, serif;

      font-size: clamp(76px, 6.4vw, 122px);
      line-height: .94;

      font-weight: 400;
      letter-spacing: -.035em;

      color: #111;
    }

    /* =========================================================
       ЛИНИЯ + ЗВЕЗДА
       ========================================================= */

    .ornament {
      position: absolute;

      left: 4.8vw;
      top: 61.7vh;

      width: min(33vw, 625px);

      display: flex;
      align-items: center;
      gap: 16px;
    }

    .ornament-line {
      height: 1px;
      flex: 1;

      background: rgba(17,17,17,.84);
    }

    .ornament-star {
      display: block;

      font-size: 20px;
      line-height: 1;

      color: #111;
    }

    /* =========================================================
       ТРИ ФРАЗЫ — ОДНА СТРОКА
       ========================================================= */

    .descriptor {
      position: absolute;

      left: 4.8vw;
      top: 66vh;

      font-size: clamp(12px, 1vw, 18px);
      font-weight: 500;

      letter-spacing: .025em;

      color: #111;

      white-space: nowrap;
    }

    /* =========================================================
       БРЕНДЫ
       ========================================================= */

    .brands {
      position: absolute;

      left: 4.8vw;
      top: 77.2vh;

      display: flex;
      align-items: center;

      gap: clamp(25px, 2vw, 38px);
    }

    .brand-wrap {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      height: 76px;
    }

    .brand-wrap + .brand-wrap::before {
      content: "";

      position: absolute;

      left: calc(clamp(25px, 2vw, 38px) / -2);

      width: 1px;
      height: 62px;

      background: rgba(55,144,197,.34);
    }

    .brand {
      display: block;
      width: auto;
      object-fit: contain;
    }

    /* визуально примерно одинаковая масса */
    .brand-galax {
      height: clamp(51px, 4.1vw, 69px);
    }

    .brand-washfree {
      height: clamp(57px, 4.5vw, 76px);
    }

    .brand-prowash {
      height: clamp(55px, 4.35vw, 73px);
    }

    /* =========================================================
       ГОРТАЙТЕ НИЖЧЕ
       ========================================================= */

    .scroll-hint {
      position: absolute;

      left: 4.8vw;
      bottom: 4vh;

      display: flex;
      align-items: center;
      gap: 16px;

      font-size: 11px;
      font-weight: 500;

      text-transform: uppercase;
      letter-spacing: .20em;

      color: rgba(17,17,17,.78);
    }

    .scroll-line {
      position: relative;

      width: 58px;
      height: 2px;

      overflow: hidden;

      background: rgba(17,17,17,.13);
    }

    .scroll-line::after {
      content: "";

      position: absolute;

      width: 34px;
      height: 2px;

      top: 0;
      left: 0;

      background: #d0a01c;

      animation: scrollMove 2.4s ease-in-out infinite alternate;
    }

    @keyframes scrollMove {
      from {
        transform: translateX(-8px);
      }

      to {
        transform: translateX(33px);
      }
    }

    /* =========================================================
       ЖИВЫЕ ПУЗЫРИ
       ========================================================= */

    .bubbles {
      position: absolute;
      inset: 0;

      z-index: 9;
      pointer-events: none;

      overflow: hidden;

      will-change: transform;
    }

    .bubble {
      position: absolute;

      border-radius: 50%;
      opacity: .82;

      border: 1.5px solid rgba(255,255,255,.74);

      background:
        radial-gradient(
          circle at 28% 20%,
          rgba(255,255,255,.98) 0%,
          rgba(255,255,255,.40) 7%,
          rgba(255,255,255,.03) 23%,
          rgba(255,255,255,.02) 57%,
          rgba(255,255,255,.16) 78%,
          rgba(255,255,255,.37) 100%
        );

      box-shadow:
        inset 9px 7px 25px rgba(255,255,255,.27),
        inset -13px -9px 27px rgba(65,194,255,.18),
        inset 13px -10px 26px rgba(243,104,255,.13),
        0 15px 42px rgba(48,111,145,.11);

      backdrop-filter: blur(1px) saturate(150%);
      -webkit-backdrop-filter: blur(1px) saturate(150%);

      will-change: transform;
    }

    .bubble::before {
      content: "";

      position: absolute;
      inset: -1px;

      border-radius: inherit;

      background:
        conic-gradient(
          from 15deg,
          transparent,
          rgba(80,224,255,.60),
          rgba(120,119,255,.36),
          rgba(255,100,217,.49),
          rgba(255,210,112,.41),
          rgba(88,235,255,.50),
          transparent
        );

      mask:
        radial-gradient(
          farthest-side,
          transparent calc(100% - 7px),
          #000 calc(100% - 5px)
        );

      -webkit-mask:
        radial-gradient(
          farthest-side,
          transparent calc(100% - 7px),
          #000 calc(100% - 5px)
        );
    }

    .bubble::after {
      content: "";

      position: absolute;

      width: 27%;
      height: 15%;

      left: 18%;
      top: 13%;

      border-radius: 50%;

      transform: rotate(-28deg);

      background: rgba(255,255,255,.90);

      filter: blur(5px);
    }

    .b1 {
      width: 230px;
      height: 230px;

      right: -55px;
      top: 8%;

      animation: bubble1 11s ease-in-out infinite alternate;
    }

    .b2 {
      width: 160px;
      height: 160px;

      left: 46%;
      top: 2%;

      animation: bubble2 9s ease-in-out infinite alternate;
    }

    .b3 {
      width: 125px;
      height: 125px;

      left: 52%;
      bottom: 11%;

      animation: bubble3 10s ease-in-out infinite alternate;
    }

    .b4 {
      width: 84px;
      height: 84px;

      left: 44%;
      top: 26%;

      animation: bubble4 7.6s ease-in-out infinite alternate;
    }

    .b5 {
      width: 59px;
      height: 59px;

      right: 39%;
      top: 42%;

      animation: bubble5 6.8s ease-in-out infinite alternate;
    }

    .b6 {
      width: 42px;
      height: 42px;

      right: 11%;
      bottom: 10%;

      animation: bubble6 6s ease-in-out infinite alternate;
    }

    .b7 {
      width: 31px;
      height: 31px;

      right: 16%;
      top: 6%;

      animation: bubble7 5.4s ease-in-out infinite alternate;
    }

    @keyframes bubble1 {
      from {
        transform: translate3d(0,55px,0);
      }

      to {
        transform: translate3d(-75px,-90px,0);
      }
    }

    @keyframes bubble2 {
      from {
        transform: translate3d(-8px,45px,0);
      }

      to {
        transform: translate3d(48px,-75px,0);
      }
    }

    @keyframes bubble3 {
      from {
        transform: translate3d(0,38px,0);
      }

      to {
        transform: translate3d(-38px,-85px,0);
      }
    }

    @keyframes bubble4 {
      from {
        transform: translate3d(-10px,32px,0);
      }

      to {
        transform: translate3d(28px,-74px,0);
      }
    }

    @keyframes bubble5 {
      from {
        transform: translate3d(0,25px,0);
      }

      to {
        transform: translate3d(22px,-60px,0);
      }
    }

    @keyframes bubble6 {
      from {
        transform: translate3d(0,20px,0);
      }

      to {
        transform: translate3d(-22px,-55px,0);
      }
    }

    @keyframes bubble7 {
      from {
        transform: translate3d(0,18px,0);
      }

      to {
        transform: translate3d(17px,-48px,0);
      }
    }

    /* =========================================================
       МОБИЛЬНАЯ ВЕРСИЯ
       ========================================================= */

    @media (max-width: 900px) {

      .hero {
        min-height: 760px;
      }

      .hero-photo {
        background-position: 67% center;
      }

      .left-mask {
        width: 83%;
        min-width: 0;
      }

      .logo-2k {
        left: 6vw;
        top: 4vh;
        width: 82px;
      }

      .category {
        left: 6vw;
        top: 31vh;

        font-size: 15px;
        letter-spacing: .13em;
      }

      .title {
        left: 6vw;
        top: 38vh;

        font-size: 59px;
      }

      .ornament {
        left: 6vw;
        top: 49vh;

        width: 69vw;
      }

      .descriptor {
        left: 6vw;
        top: 53vh;

        max-width: 72vw;

        white-space: normal;

        font-size: 13px;
        line-height: 1.5;
      }

      .brands {
        left: 6vw;
        top: auto;
        bottom: 10vh;

        gap: 17px;
      }

      .brand-wrap {
        height: 50px;
      }

      .brand-galax {
        height: 37px;
      }

      .brand-washfree {
        height: 43px;
      }

      .brand-prowash {
        height: 41px;
      }

      .brand-wrap + .brand-wrap::before {
        display: none;
      }

      .scroll-hint {
        display: none;
      }

      .b1 {
        width: 160px;
        height: 160px;
      }

      .b2 {
        width: 105px;
        height: 105px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-photo,
      .light::before,
      .bubble,
      .scroll-line::after {
        animation: none !important;
      }
    }

  </style>
</head>

<body>

  <main class="hero" id="hero">

    <div class="hero-photo"></div>

    <div class="left-mask"></div>

    <div class="light"></div>

    <div class="bubbles" id="bubbles">
      <div class="bubble b1"></div>
      <div class="bubble b2"></div>
      <div class="bubble b3"></div>
      <div class="bubble b4"></div>
      <div class="bubble b5"></div>
      <div class="bubble b6"></div>
      <div class="bubble b7"></div>
    </div>

    <section class="content">

      <img
        class="logo-2k"
        src="assets/2K_logo%20(7).png"
        alt="2K"
      >

      <div class="category">
        <span>HOUSE CARE</span>
        <span class="dot"></span>
        <span>2026</span>
      </div>

      <h1 class="title">
        НОВИНКИ
      </h1>

      <div class="ornament">
        <span class="ornament-line"></span>
        <span class="ornament-star">✦</span>
        <span class="ornament-line"></span>
      </div>

      <div class="descriptor">
        НОВІ ФОРМУЛИ. НОВІ АРОМАТИ. НОВІ РІШЕННЯ ДЛЯ ДОМУ.
      </div>

      <div class="brands">

        <div class="brand-wrap">
          <img
            class="brand brand-galax"
            src="assets/galax-logo.png"
            alt="GALAX"
          >
        </div>

        <div class="brand-wrap">
          <img
            class="brand brand-washfree"
            src="assets/washfree-logo.png"
            alt="WASH & FREE"
          >
        </div>

        <div class="brand-wrap">
          <img
            class="brand brand-prowash"
            src="assets/prowash-logo-full.png"
            alt="PRO WASH"
          >
        </div>

      </div>

      <div class="scroll-hint">
        <span class="scroll-line"></span>
        <span>ГОРТАЙТЕ НИЖЧЕ</span>
      </div>

    </section>

  </main>

  <script>

    const hero =
      document.getElementById("hero");

    const bubbles =
      document.getElementById("bubbles");

    hero.addEventListener(
      "mousemove",
      (event) => {

        const x =
          event.clientX / window.innerWidth - .5;

        const y =
          event.clientY / window.innerHeight - .5;

        bubbles.style.transform =
          `translate3d(
            ${x * -16}px,
            ${y * -12}px,
            0
          )`;
      }
    );

    hero.addEventListener(
      "mouseleave",
      () => {

        bubbles.style.transform =
          "translate3d(0,0,0)";
      }
    );

  </script>

</body>
</html>
