<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>2K House Care • 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  font-family:"DM Sans",sans-serif;
  color:#111;
  background:#eef7fb;
  overflow-x:hidden;
}

.hero{
  position:relative;
  width:100vw;
  height:100vh;
  min-height:720px;
  overflow:hidden;
  isolation:isolate;
}

/* ========================================
   УТВЕРЖДЕННЫЙ ФОН
   ======================================== */

.hero-bg{
  position:absolute;
  inset:-1%;
  z-index:0;

  background:
    url("assets/hero-laundry-clean.png")
    58% center / cover no-repeat;

  transform:scale(1.02);

  animation:
    bgBreath 16s ease-in-out infinite alternate;
}

@keyframes bgBreath{
  from{
    transform:
      scale(1.02)
      translate3d(0,0,0);
  }

  to{
    transform:
      scale(1.045)
      translate3d(-0.35%,-0.2%,0);
  }
}


/* ========================================
   ЛЕВАЯ ПОДЛОЖКА
   ======================================== */

.left-light{
  position:absolute;
  inset:0 auto 0 0;

  width:42.5vw;
  min-width:610px;

  z-index:2;
  pointer-events:none;

  background:
    linear-gradient(
      90deg,
      rgba(245,251,254,.88) 0%,
      rgba(241,249,253,.82) 48%,
      rgba(237,247,252,.58) 72%,
      rgba(235,246,252,.20) 91%,
      rgba(235,246,252,0) 100%
    );
}


/* ========================================
   НИКАКОГО ИСКУССТВЕННОГО ПРОЖЕКТОРА
   ======================================== */

.light-sweep{
  display:none;
}


/* ========================================
   УТВЕРЖДЕННАЯ КОМПОЗИЦИЯ
   ======================================== */

.content{
  position:relative;
  z-index:20;

  width:100%;
  height:100%;
}


/* 2K */

.logo2k{
  position:absolute;

  left:4.5vw;
  top:4.3vh;

  width:clamp(92px,6.4vw,123px);
  height:auto;

  display:block;

  filter:
    grayscale(1)
    brightness(0);
}


/* HOUSE CARE */

.category{
  position:absolute;

  left:4.55vw;
  top:35.2vh;

  display:flex;
  align-items:center;

  gap:15px;

  font-size:
    clamp(22px,1.72vw,32px);

  font-weight:600;
  line-height:1;

  letter-spacing:.17em;

  color:#111;

  white-space:nowrap;
}

.category-dot{
  width:6px;
  height:6px;

  flex:none;

  border-radius:50%;
  background:#111;
}


/* НОВИНКИ */

.title{
  position:absolute;

  left:4.35vw;
  top:44.4vh;

  font-family:
    "Playfair Display",
    Georgia,
    serif;

  font-size:
    clamp(66px,5.6vw,106px);

  font-weight:400;
  line-height:.95;

  letter-spacing:-.035em;

  color:#111;
}


/* РАЗДЕЛИТЕЛЬ */

.ornament{
  position:absolute;

  left:4.55vw;
  top:59.9vh;

  width:min(32vw,610px);

  display:flex;
  align-items:center;

  gap:15px;
}

.ornament-line{
  height:1px;
  flex:1;

  background:
    rgba(17,17,17,.82);
}

.ornament-star{
  font-size:18px;
  line-height:1;
}


/* ТРИ ФРАЗЫ */

.descriptor{
  position:absolute;

  left:4.55vw;
  top:64.4vh;

  font-size:
    clamp(12px,.97vw,18px);

  font-weight:500;
  line-height:1.2;

  letter-spacing:.018em;

  white-space:nowrap;
}


/* ========================================
   ЛОГОТИПЫ
   ======================================== */

.brands{
  position:absolute;

  left:4.55vw;
  top:75.5vh;

  display:flex;
  align-items:center;

  gap:
    clamp(25px,2vw,38px);
}

.brand-wrap{
  position:relative;

  height:76px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.brand-wrap + .brand-wrap::before{
  content:"";

  position:absolute;

  left:
    calc(
      clamp(25px,2vw,38px) / -2
    );

  width:1px;
  height:62px;

  background:
    rgba(56,143,195,.30);
}

.brand{
  width:auto;

  display:block;
  object-fit:contain;
}

.galax{
  height:
    clamp(50px,4vw,68px);
}

.washfree{
  height:
    clamp(56px,4.45vw,75px);
}

.prowash{
  height:
    clamp(54px,4.3vw,72px);
}


/* ========================================
   ГОРТАЙТЕ НИЖЧЕ
   ======================================== */

.scroll{
  position:absolute;

  left:4.55vw;
  bottom:3.5vh;

  display:flex;
  align-items:center;

  gap:16px;

  font-size:11px;
  font-weight:500;

  letter-spacing:.20em;

  text-transform:uppercase;

  white-space:nowrap;
}

.scroll-line{
  position:relative;

  width:58px;
  height:2px;

  overflow:hidden;

  background:
    rgba(17,17,17,.10);
}

.scroll-line::after{
  content:"";

  position:absolute;

  top:0;
  left:0;

  width:34px;
  height:2px;

  background:#cca019;

  animation:
    scrollMove 2.2s ease-in-out infinite alternate;
}

@keyframes scrollMove{
  from{
    transform:translateX(-8px);
  }

  to{
    transform:translateX(33px);
  }
}


/* ============================================================
   ГЛАМУРНЫЕ ПЛАВАЮЩИЕ ПУЗЫРИ
   ============================================================ */

.bubble-field{
  position:absolute;
  inset:0;

  z-index:9;

  pointer-events:none;
  overflow:hidden;

  will-change:transform;
}


/*
  Пузырь почти пустой внутри.
  Основная красота — в радужной плёнке и бликах.
*/

.bubble{
  position:absolute;

  border-radius:50%;

  border:none;

  background:
    radial-gradient(
      circle at 30% 23%,
      rgba(255,255,255,.92) 0%,
      rgba(255,255,255,.20) 5%,
      rgba(255,255,255,.03) 10%,
      transparent 19%
    ),
    radial-gradient(
      circle at 74% 77%,
      rgba(255,145,225,.055) 0%,
      transparent 34%
    ),
    radial-gradient(
      circle at 18% 72%,
      rgba(86,223,255,.055) 0%,
      transparent 31%
    );

  opacity:.97;

  box-shadow:
    inset 7px 6px 16px rgba(255,255,255,.11),
    inset -6px -5px 16px rgba(96,218,255,.025);

  will-change:
    transform,
    opacity,
    filter;
}


/* СИЛЬНО ЗАМЕТНЕЕ РАДУЖНАЯ ПЛЁНКА */

.bubble::before{
  content:"";

  position:absolute;
  inset:-2px;

  border-radius:50%;

  background:
    conic-gradient(
      from 12deg,

      transparent 0deg,

      rgba(255,255,255,.30) 12deg,
      rgba(104,233,255,.78) 34deg,
      rgba(126,158,255,.48) 59deg,

      transparent 89deg,

      rgba(255,126,218,.62) 116deg,
      rgba(255,210,129,.49) 145deg,

      transparent 181deg,

      rgba(84,230,255,.67) 212deg,
      rgba(168,148,255,.38) 236deg,

      transparent 267deg,

      rgba(255,157,232,.52) 299deg,

      transparent 332deg,

      rgba(255,255,255,.27) 360deg
    );

  -webkit-mask:
    radial-gradient(
      farthest-side,
      transparent calc(100% - 5px),
      #000 calc(100% - 2px)
    );

  mask:
    radial-gradient(
      farthest-side,
      transparent calc(100% - 5px),
      #000 calc(100% - 2px)
    );

  filter:
    drop-shadow(
      0 0 3px rgba(255,255,255,.70)
    )
    drop-shadow(
      0 0 5px rgba(159,220,255,.18)
    );
}


/* ЯРКИЙ БЛИК НА ПУЗЫРЕ */

.bubble::after{
  content:"";

  position:absolute;

  left:15%;
  top:10%;

  width:24%;
  height:12%;

  border-radius:50%;

  transform:
    rotate(-32deg);

  background:
    radial-gradient(
      ellipse at center,

      rgba(255,255,255,1) 0%,
      rgba(255,255,255,.82) 24%,
      rgba(255,255,255,.24) 54%,
      transparent 78%
    );

  filter:
    blur(1px);

  box-shadow:
    0 0 7px rgba(255,255,255,.95),
    0 0 16px rgba(255,255,255,.52);
}


/* ========================================
   БОЛЬШИЕ + СРЕДНИЕ + МЕЛКИЕ
   ======================================== */

.b1{
  width:225px;
  height:225px;

  right:-45px;
  top:8%;

  animation:
    float1 8.5s ease-in-out infinite alternate,
    shimmer 3.2s ease-in-out infinite alternate;
}

.b2{
  width:168px;
  height:168px;

  left:47%;
  top:4%;

  animation:
    float2 7.8s ease-in-out infinite alternate,
    shimmer 3.7s ease-in-out infinite alternate;
}

.b3{
  width:138px;
  height:138px;

  left:49%;
  bottom:11%;

  animation:
    float3 7.4s ease-in-out infinite alternate,
    shimmer 3.1s ease-in-out infinite alternate;
}

.b4{
  width:105px;
  height:105px;

  left:42%;
  top:19%;

  animation:
    float4 6.5s ease-in-out infinite alternate,
    shimmer 2.9s ease-in-out infinite alternate;
}

.b5{
  width:82px;
  height:82px;

  right:36%;
  top:32%;

  animation:
    float5 6s ease-in-out infinite alternate,
    shimmer 3.4s ease-in-out infinite alternate;
}

.b6{
  width:61px;
  height:61px;

  right:19%;
  bottom:16%;

  animation:
    float6 5.7s ease-in-out infinite alternate,
    shimmer 2.8s ease-in-out infinite alternate;
}

.b7{
  width:42px;
  height:42px;

  left:56%;
  top:27%;

  animation:
    float7 5.3s ease-in-out infinite alternate,
    shimmer 2.6s ease-in-out infinite alternate;
}

.b8{
  width:32px;
  height:32px;

  right:13%;
  top:8%;

  animation:
    float8 4.9s ease-in-out infinite alternate,
    shimmer 2.5s ease-in-out infinite alternate;
}

.b9{
  width:54px;
  height:54px;

  left:39%;
  bottom:24%;

  animation:
    float9 5.9s ease-in-out infinite alternate,
    shimmer 3s ease-in-out infinite alternate;
}


/* ========================================
   ЗАМЕТНО ПЛАВАЮТ
   ======================================== */

@keyframes float1{
  from{
    transform:
      translate3d(28px,78px,0)
      scale(.96)
      rotate(-3deg);
  }

  to{
    transform:
      translate3d(-110px,-110px,0)
      scale(1.04)
      rotate(5deg);
  }
}

@keyframes float2{
  from{
    transform:
      translate3d(-28px,70px,0)
      scale(.97);
  }

  to{
    transform:
      translate3d(88px,-105px,0)
      scale(1.045);
  }
}

@keyframes float3{
  from{
    transform:
      translate3d(22px,55px,0)
      scale(.97);
  }

  to{
    transform:
      translate3d(-78px,-100px,0)
      scale(1.04);
  }
}

@keyframes float4{
  from{
    transform:
      translate3d(-24px,45px,0);
  }

  to{
    transform:
      translate3d(68px,-88px,0);
  }
}

@keyframes float5{
  from{
    transform:
      translate3d(20px,39px,0);
  }

  to{
    transform:
      translate3d(-54px,-81px,0);
  }
}

@keyframes float6{
  from{
    transform:
      translate3d(-15px,31px,0);
  }

  to{
    transform:
      translate3d(48px,-73px,0);
  }
}

@keyframes float7{
  from{
    transform:
      translate3d(0,28px,0);
  }

  to{
    transform:
      translate3d(40px,-65px,0);
  }
}

@keyframes float8{
  from{
    transform:
      translate3d(0,22px,0);
  }

  to{
    transform:
      translate3d(-33px,-56px,0);
  }
}

@keyframes float9{
  from{
    transform:
      translate3d(-14px,33px,0);
  }

  to{
    transform:
      translate3d(49px,-71px,0);
  }
}


/* слегка меняется сияние */

@keyframes shimmer{
  from{
    filter:
      brightness(.96)
      saturate(.98);

    opacity:.84;
  }

  to{
    filter:
      brightness(1.17)
      saturate(1.20);

    opacity:1;
  }
}


/* ========================================
   МОБИЛЬНАЯ ВЕРСИЯ
   ======================================== */

@media(max-width:900px){

  .hero{
    min-height:760px;
  }

  .hero-bg{
    background-position:
      67% center;
  }

  .left-light{
    width:82%;
    min-width:0;
  }

  .logo2k{
    left:6vw;
    top:4vh;
    width:82px;
  }

  .category{
    left:6vw;
    top:30vh;

    font-size:16px;
    letter-spacing:.13em;
  }

  .title{
    left:6vw;
    top:38vh;

    font-size:55px;
  }

  .ornament{
    left:6vw;
    top:49vh;

    width:68vw;
  }

  .descriptor{
    left:6vw;
    top:53vh;

    max-width:72vw;

    white-space:normal;

    font-size:13px;
    line-height:1.5;
  }

  .brands{
    left:6vw;

    top:auto;
    bottom:10vh;

    gap:17px;
  }

  .brand-wrap{
    height:50px;
  }

  .galax{height:37px;}
  .washfree{height:43px;}
  .prowash{height:41px;}

  .brand-wrap + .brand-wrap::before{
    display:none;
  }

  .scroll{
    display:none;
  }

}

</style>
</head>


<body>

<main class="hero" id="hero">

  <div class="hero-bg"></div>

  <div class="left-light"></div>

  <div class="light-sweep"></div>


  <div
    class="bubble-field"
    id="bubbleField"
  >

    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>
    <div class="bubble b4"></div>
    <div class="bubble b5"></div>
    <div class="bubble b6"></div>
    <div class="bubble b7"></div>
    <div class="bubble b8"></div>
    <div class="bubble b9"></div>

  </div>


  <section class="content">

    <img
      class="logo2k"
      src="assets/2K_logo%20(7).png"
      alt="2K"
    >


    <div class="category">

      <span>HOUSE CARE</span>

      <span
        class="category-dot"
      ></span>

      <span>2026</span>

    </div>


    <h1 class="title">
      НОВИНКИ
    </h1>


    <div class="ornament">

      <span
        class="ornament-line"
      ></span>

      <span
        class="ornament-star"
      >
        ✦
      </span>

      <span
        class="ornament-line"
      ></span>

    </div>


    <div class="descriptor">

      НОВІ ФОРМУЛИ. НОВІ АРОМАТИ. НОВІ РІШЕННЯ ДЛЯ ДОМУ.

    </div>


    <div class="brands">

      <div class="brand-wrap">

        <img
          class="brand galax"
          src="assets/galax-logo.png"
          alt="GALAX"
        >

      </div>


      <div class="brand-wrap">

        <img
          class="brand washfree"
          src="assets/washfree-logo.png"
          alt="WASH & FREE"
        >

      </div>


      <div class="brand-wrap">

        <img
          class="brand prowash"
          src="assets/prowash-logo-full.png"
          alt="PRO WASH"
        >

      </div>

    </div>


    <div class="scroll">

      <span
        class="scroll-line"
      ></span>

      <span>
        ГОРТАЙТЕ НИЖЧЕ
      </span>

    </div>

  </section>

</main>


<script>

const hero =
  document.getElementById("hero");

const bubbleField =
  document.getElementById("bubbleField");


hero.addEventListener(
  "mousemove",
  event => {

    const x =
      event.clientX /
      window.innerWidth - .5;

    const y =
      event.clientY /
      window.innerHeight - .5;


    bubbleField.style.transform =
      `translate3d(
        ${x * -20}px,
        ${y * -15}px,
        0
      )`;

  }
);


hero.addEventListener(
  "mouseleave",
  () => {

    bubbleField.style.transform =
      "translate3d(0,0,0)";

  }
);

</script>

</body>
</html>
