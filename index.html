<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2К — Новинки 2026</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f5f3;
      color: #111;
    }

    body {
      overflow: hidden;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 650px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 10%, rgba(255,255,255,.95), rgba(244,245,243,.55) 55%, rgba(235,237,236,.9) 100%);
    }

    /* ЖИВАЯ ЖИДКАЯ СРЕДА */

    .liquid {
      position: absolute;
      inset: -15%;
      filter: blur(55px);
      opacity: .88;
      transform: scale(1.15);
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      will-change: transform;
      mix-blend-mode: multiply;
    }

    .blob-1 {
      width: 38vw;
      height: 38vw;
      min-width: 420px;
      min-height: 420px;
      left: 6%;
      top: 15%;
      background:
        radial-gradient(circle at 35% 30%,
          rgba(255,255,255,.95) 0%,
          rgba(255,90,115,.72) 18%,
          rgba(232,30,70,.82) 55%,
          rgba(232,30,70,.05) 75%);
      animation: moveOne 13s ease-in-out infinite alternate;
    }

    .blob-2 {
      width: 42vw;
      height: 42vw;
      min-width: 460px;
      min-height: 460px;
      right: 4%;
      top: -2%;
      background:
        radial-gradient(circle at 40% 35%,
          rgba(255,255,255,.9) 0%,
          rgba(51,224,232,.8) 22%,
          rgba(0,157,177,.7) 54%,
          rgba(0,157,177,.03) 76%);
      animation: moveTwo 15s ease-in-out infinite alternate;
    }

    .blob-3 {
      width: 34vw;
      height: 34vw;
      min-width: 380px;
      min-height: 380px;
      left: 39%;
      bottom: -12%;
      background:
        radial-gradient(circle at 45% 35%,
          rgba(255,255,255,.95) 0%,
          rgba(226,204,102,.65) 22%,
          rgba(197,149,44,.56) 52%,
          rgba(197,149,44,.02) 76%);
      animation: moveThree 17s ease-in-out infinite alternate;
    }

    .blob-4 {
      width: 25vw;
      height: 25vw;
      min-width: 300px;
      min-height: 300px;
      right: 24%;
      bottom: 0%;
      background:
        radial-gradient(circle,
          rgba(255,255,255,.9) 0%,
          rgba(157,216,178,.68) 32%,
          rgba(89,175,119,.42) 58%,
          rgba(89,175,119,0) 78%);
      animation: moveFour 11s ease-in-out infinite alternate;
    }

    @keyframes moveOne {
      0%   { transform: translate3d(-4%, 0, 0) scale(1); }
      45%  { transform: translate3d(16%, -8%, 0) scale(1.18); }
      100% { transform: translate3d(8%, 18%, 0) scale(.92); }
    }

    @keyframes moveTwo {
      0%   { transform: translate3d(0, 0, 0) scale(.95); }
      50%  { transform: translate3d(-18%, 12%, 0) scale(1.12); }
      100% { transform: translate3d(-6%, 26%, 0) scale(1); }
    }

    @keyframes moveThree {
      0%   { transform: translate3d(0, 0, 0) scale(1); }
      50%  { transform: translate3d(-18%, -14%, 0) scale(1.2); }
      100% { transform: translate3d(16%, -8%, 0) scale(.95); }
    }

    @keyframes moveFour {
      0%   { transform: translate3d(0, 0, 0) scale(.9); }
      100% { transform: translate3d(-30%, -18%, 0) scale(1.25); }
    }

    /* БЛИКИ / ПУЗЫРЬКИ */

    .bubble {
      position: absolute;
      border: 1px solid rgba(255,255,255,.6);
      background: rgba(255,255,255,.12);
      box-shadow:
        inset 0 0 25px rgba(255,255,255,.32),
        0 5px 30px rgba(255,255,255,.25);
      backdrop-filter: blur(3px);
      border-radius: 50%;
      opacity: .55;
      animation: floatBubble 8s ease-in-out infinite alternate;
    }

    .b1 {
      width: 110px;
      height: 110px;
      right: 15%;
      top: 18%;
    }

    .b2 {
      width: 48px;
      height: 48px;
      right: 31%;
      top: 11%;
      animation-delay: -2s;
    }

    .b3 {
      width: 76px;
      height: 76px;
      left: 21%;
      bottom: 14%;
      animation-delay: -4s;
    }

    @keyframes floatBubble {
      from { transform: translateY(20px) scale(.95); }
      to   { transform: translateY(-25px) scale(1.07); }
    }

    /* КОНТЕНТ */

    .topline {
      position: absolute;
      left: 5vw;
      right: 5vw;
      top: 38px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .logo {
      font-size: 25px;
      letter-spacing: -.03em;
      font-weight: 900;
    }

    .year {
      opacity: .55;
    }

    .content {
      position: absolute;
      z-index: 10;
      left: 5vw;
      top: 50%;
      transform: translateY(-46%);
      width: min(1030px, 86vw);
    }

    .eyebrow {
      margin-bottom: 22px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      opacity: .62;
    }

    h1 {
      max-width: 1050px;
      font-size: clamp(58px, 7.6vw, 138px);
      line-height: .86;
      letter-spacing: -.065em;
      font-weight: 800;
      text-transform: uppercase;
    }

    .accent {
      display: inline-block;
      font-weight: 300;
      font-style: italic;
    }

    .bottom-copy {
      position: absolute;
      left: 5vw;
      right: 5vw;
      bottom: 42px;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 30px;
    }

    .subtitle {
      max-width: 540px;
      font-size: clamp(16px, 1.35vw, 23px);
      line-height: 1.45;
      font-weight: 400;
    }

    .brands {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .brand {
      border: 1px solid rgba(0,0,0,.22);
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 11px;
      letter-spacing: .08em;
      font-weight: 700;
      background: rgba(255,255,255,.25);
      backdrop-filter: blur(7px);
    }

    .scroll {
      position: absolute;
      right: 5vw;
      top: 50%;
      z-index: 10;
      writing-mode: vertical-rl;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .18em;
      opacity: .45;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% { transform: translateY(-50%); opacity: .35; }
      50% { transform: translateY(-44%); opacity: .75; }
    }

    /* МЕЛКАЯ ФАКТУРА */

    .noise {
      position: absolute;
      inset: 0;
      z-index: 5;
      opacity: .055;
      pointer-events: none;
      background-image:
        repeating-radial-gradient(
          circle at 0 0,
          transparent 0,
          rgba(0,0,0,.35) .7px,
          transparent 1.4px
        );
      background-size: 5px 5px;
    }

    @media (max-width: 800px) {
      .hero {
        min-height: 100svh;
      }

      h1 {
        font-size: clamp(54px, 16vw, 92px);
        line-height: .9;
      }

      .content {
        top: 45%;
      }

      .bottom-copy {
        display: block;
      }

      .brands {
        justify-content: flex-start;
        margin-top: 22px;
      }

      .scroll {
        display: none;
      }
    }

  </style>
</head>

<body>

  <main class="hero" id="hero">

    <div class="liquid" id="liquid">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
      <div class="blob blob-4"></div>
    </div>

    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>

    <div class="noise"></div>

    <header class="topline">
      <div class="logo">2К</div>
      <div class="year">NEW PRODUCTS · 2026</div>
    </header>

    <section class="content">
      <div class="eyebrow">Побутова хімія · Новинки 2026</div>

      <h1>
        НОВЕ,<br>
        ЩО ХОЧЕТЬСЯ<br>
        <span class="accent">ПОБАЧИТИ</span><br>
        НА ПОЛИЦІ
      </h1>
    </section>

    <div class="bottom-copy">
      <div class="subtitle">
        Нові продукти. Нові аромати. Нові приводи
        обирати знайомі бренди.
      </div>

      <div class="brands">
        <div class="brand">GALAX</div>
        <div class="brand">GALAX LUX</div>
        <div class="brand">WASH&amp;FREE</div>
        <div class="brand">LIMITED EDITION</div>
      </div>
    </div>

    <div class="scroll">рухай мишкою</div>

  </main>


  <script>
    const hero = document.getElementById('hero');
    const liquid = document.getElementById('liquid');

    hero.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 18;
      const y = (e.clientY / window.innerHeight - 0.5) * 18;

      liquid.style.transform =
        `translate3d(${x}px, ${y}px, 0) scale(1.15)`;
    });

    hero.addEventListener('mouseleave', () => {
      liquid.style.transform =
        'translate3d(0,0,0) scale(1.15)';
    });
  </script>

</body>
</html>
