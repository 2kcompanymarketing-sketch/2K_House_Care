<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>2K House Care • 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  font-family:"DM Sans",sans-serif;
  color:#111;
  background:#eef7fb;
  overflow-x:hidden;
}

.hero{
  position:relative;
  width:100vw;
  height:100vh;
  min-height:720px;
  overflow:hidden;
  isolation:isolate;
}

/* ========================================
   УТВЕРЖДЕННЫЙ ЧИСТЫЙ ФОН
   ======================================== */

.hero-bg{
  position:absolute;
  inset:-1%;
  z-index:0;

  background:
    url("assets/hero-laundry-clean.png")
    58% center / cover no-repeat;

  transform:scale(1.02);

  animation:
    bgBreath 16s ease-in-out infinite alternate;
}

@keyframes bgBreath{

  from{
    transform:
      scale(1.02)
      translate3d(0,0,0);
  }

  to{
    transform:
      scale(1.045)
      translate3d(-0.35%,-0.2%,0);
  }
}


/* ========================================
   ЛЕВАЯ ПОДЛОЖКА
   ======================================== */

.left-light{
  position:absolute;
  inset:0 auto 0 0;

  width:42.5vw;
  min-width:610px;

  z-index:2;
  pointer-events:none;

  background:
    linear-gradient(
      90deg,
      rgba(245,251,254,.88) 0%,
      rgba(241,249,253,.82) 48%,
      rgba(237,247,252,.58) 72%,
      rgba(235,246,252,.20) 91%,
      rgba(235,246,252,0) 100%
    );
}


/* ========================================
   МЯГКИЙ СВЕТ
   ======================================== */

.light-sweep{
  position:absolute;
  inset:0;

  z-index:3;

  overflow:hidden;
  pointer-events:none;

  mix-blend-mode:screen;
}

.light-sweep::after{
  content:"";

  position:absolute;

  width:40vw;
  height:130vh;

  left:45vw;
  top:-20vh;

  transform:rotate(8deg);

  filter:blur(18px);

  background:
    linear-gradient(
      112deg,
      transparent 22%,
      rgba(255,255,255,.04) 34%,
      rgba(255,255,255,.32) 49%,
      rgba(193,235,255,.12) 58%,
      transparent 72%
    );

  animation:
    lightMove 8s ease-in-out infinite alternate;
}

@keyframes lightMove{

  from{
    transform:
      translateX(-7vw)
      rotate(8deg);

    opacity:.5;
  }

  to{
    transform:
      translateX(10vw)
      rotate(8deg);

    opacity:.95;
  }
}


/* ========================================
   УТВЕРЖДЕННАЯ КОМПОЗИЦИЯ
   ======================================== */

.content{
  position:relative;
  z-index:20;

  width:100%;
  height:100%;
}


/* 2K */

.logo2k{
  position:absolute;

  left:4.5vw;
  top:4.3vh;

  width:clamp(92px,6.4vw,123px);
  height:auto;

  display:block;

  filter:
    grayscale(1)
    brightness(0);
}


/* HOUSE CARE */

.category{
  position:absolute;

  left:4.55vw;
  top:35.2vh;

  display:flex;
  align-items:center;

  gap:15px;

  font-size:
    clamp(22px,1.72vw,32px);

  font-weight:600;
  line-height:1;

  letter-spacing:.17em;

  color:#111;

  white-space:nowrap;
}

.category-dot{
  width:6px;
  height:6px;

  flex:none;

  border-radius:50%;
  background:#111;
}


/* НОВИНКИ */

.title{
  position:absolute;

  left:4.35vw;
  top:44.4vh;

  font-family:
    "Playfair Display",
    Georgia,
    serif;

  font-size:
    clamp(66px,5.6vw,106px);

  font-weight:400;
  line-height:.95;

  letter-spacing:-.035em;

  color:#111;
}


/* РАЗДЕЛИТЕЛЬ */

.ornament{
  position:absolute;

  left:4.55vw;
  top:59.9vh;

  width:min(32vw,610px);

  display:flex;
  align-items:center;

  gap:15px;
}

.ornament-line{
  height:1px;
  flex:1;

  background:
    rgba(17,17,17,.82);
}

.ornament-star{
  font-size:18px;
  line-height:1;
}


/* ТРИ ФРАЗЫ */

.descriptor{
  position:absolute;

  left:4.55vw;
  top:64.4vh;

  font-size:
    clamp(12px,.97vw,18px);

  font-weight:500;
  line-height:1.2;

  letter-spacing:.018em;

  white-space:nowrap;
}


/* ========================================
   ЛОГОТИПЫ
   ======================================== */

.brands{
  position:absolute;

  left:4.55vw;
  top:75.5vh;

  display:flex;
  align-items:center;

  gap:
    clamp(25px,2vw,38px);
}

.brand-wrap{
  position:relative;

  height:76px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.brand-wrap + .brand-wrap::before{
  content:"";

  position:absolute;

  left:
    calc(
      clamp(25px,2vw,38px) / -2
    );

  width:1px;
  height:62px;

  background:
    rgba(56,143,195,.30);
}

.brand{
  width:auto;

  display:block;
  object-fit:contain;
}

.galax{
  height:
    clamp(50px,4vw,68px);
}

.washfree{
  height:
    clamp(56px,4.45vw,75px);
}

.prowash{
  height:
    clamp(54px,4.3vw,72px);
}


/* ========================================
   ГОРТАЙТЕ НИЖЧЕ
   ======================================== */

.scroll{
  position:absolute;

  left:4.55vw;
  bottom:3.5vh;

  display:flex;
  align-items:center;

  gap:16px;

  font-size:11px;
  font-weight:500;

  letter-spacing:.20em;

  text-transform:uppercase;

  white-space:nowrap;
}

.scroll-line{
  position:relative;

  width:58px;
  height:2px;

  overflow:hidden;

  background:
    rgba(17,17,17,.10);
}

.scroll-line::after{
  content:"";

  position:absolute;

  top:0;
  left:0;

  width:34px;
  height:2px;

  background:#cca019;

  animation:
    scrollMove 2.2s ease-in-out infinite alternate;
}

@keyframes scrollMove{

  from{
    transform:
      translateX(-8px);
  }

  to{
    transform:
      translateX(33px);
  }
}


/* ============================================================
   ГЛАМУРНЫЕ ДВИЖУЩИЕСЯ ПУЗЫРИ
   ============================================================ */

.bubble-field{
  position:absolute;
  inset:0;

  z-index:9;

  pointer-events:none;
  overflow:hidden;

  will-change:transform;
}


/*
  Главное отличие:
  НЕТ равномерного border.
  НЕТ матового blur.
  НЕТ голубой непрозрачной заливки.
*/

.bubble{
  position:absolute;

  border-radius:50%;

  border:none;

  background:

    /* верхний белый отблеск */
    radial-gradient(
      circle at 28% 20%,
      rgba(255,255,255,.95) 0%,
      rgba(255,255,255,.26) 4%,
      rgba(255,255,255,.045) 9%,
      rgba(255,255,255,0) 20%
    ),

    /* едва заметная розовая пленка */
    radial-gradient(
      circle at 73% 76%,
      rgba(255,157,224,.035) 0%,
      rgba(255,157,224,0) 32%
    ),

    /* едва заметная голубая пленка */
    radial-gradient(
      circle at 20% 72%,
      rgba(104,222,255,.035) 0%,
      rgba(104,222,255,0) 31%
    );

  box-shadow:
    inset 5px 4px 12px
      rgba(255,255,255,.075),

    inset -4px -5px 13px
      rgba(126,218,255,.018);

  opacity:.86;

  backdrop-filter:none;
  -webkit-backdrop-filter:none;

  will-change:
    transform,
    filter,
    opacity;
}


/*
  ФРАГМЕНТАРНАЯ радужная кромка.
  Она специально НЕ выглядит
  как нарисованная окружность.
*/

.bubble::before{
  content:"";

  position:absolute;
  inset:-1px;

  border-radius:50%;

  background:
    conic-gradient(
      from 18deg,

      transparent 0deg,
      rgba(255,255,255,.06) 20deg,

      rgba(106,226,255,.55) 43deg,
      rgba(144,156,255,.20) 69deg,

      transparent 99deg,

      rgba(255,150,222,.36) 127deg,
      rgba(255,224,155,.23) 158deg,

      transparent 194deg,

      rgba(100,229,255,.38) 222deg,

      transparent 258deg,

      rgba(235,173,255,.24) 291deg,

      transparent 329deg,

      rgba(255,255,255,.07) 360deg
    );

  -webkit-mask:
    radial-gradient(
      farthest-side,
      transparent calc(100% - 3px),
      #000 calc(100% - 1.7px)
    );

  mask:
    radial-gradient(
      farthest-side,
      transparent calc(100% - 3px),
      #000 calc(100% - 1.7px)
    );

  opacity:.82;

  filter:
    drop-shadow(
      0 0 2px
      rgba(255,255,255,.55)
    );
}


/* СИЯЮЩИЙ БЛИК */

.bubble::after{
  content:"";

  position:absolute;

  left:16%;
  top:11%;

  width:19%;
  height:10%;

  border-radius:50%;

  transform:
    rotate(-31deg);

  background:
    radial-gradient(
      ellipse at center,

      rgba(255,255,255,.98) 0%,

      rgba(255,255,255,.62) 31%,

      rgba(255,255,255,0) 76%
    );

  filter:
    blur(1.4px);

  box-shadow:
    0 0 5px
      rgba(255,255,255,.95),

    0 0 12px
      rgba(255,255,255,.40);
}


/* ========================================
   РАЗМЕРЫ И ПОЗИЦИИ
   ======================================== */

.b1{
  width:190px;
  height:190px;

  right:-25px;
  top:10%;

  animation:
    float1 8.2s ease-in-out infinite alternate,
    shine 3.3s ease-in-out infinite alternate;
}

.b2{
  width:135px;
  height:135px;

  left:47%;
  top:5%;

  animation:
    float2 7.5s ease-in-out infinite alternate,
    shine 3.8s ease-in-out infinite alternate;
}

.b3{
  width:112px;
  height:112px;

  left:51%;
  bottom:13%;

  animation:
    float3 7.2s ease-in-out infinite alternate,
    shine 3.2s ease-in-out infinite alternate;
}

.b4{
  width:82px;
  height:82px;

  left:43%;
  top:20%;

  animation:
    float4 6.5s ease-in-out infinite alternate,
    shine 2.9s ease-in-out infinite alternate;
}

.b5{
  width:66px;
  height:66px;

  right:37%;
  top:35%;

  animation:
    float5 6s ease-in-out infinite alternate,
    shine 3.4s ease-in-out infinite alternate;
}

.b6{
  width:48px;
  height:48px;

  right:20%;
  bottom:17%;

  animation:
    float6 5.6s ease-in-out infinite alternate,
    shine 2.8s ease-in-out infinite alternate;
}

.b7{
  width:34px;
  height:34px;

  left:56%;
  top:29%;

  animation:
    float7 5.2s ease-in-out infinite alternate,
    shine 2.6s ease-in-out infinite alternate;
}


/* ========================================
   ЗАМЕТНОЕ ПЛАВНОЕ ДВИЖЕНИЕ
   ======================================== */

@keyframes float1{

  from{
    transform:
      translate3d(22px,65px,0)
      scale(.96)
      rotate(-2deg);
  }

  to{
    transform:
      translate3d(-95px,-100px,0)
      scale(1.04)
      rotate(4deg);
  }
}

@keyframes float2{

  from{
    transform:
      translate3d(-25px,58px,0)
      scale(.97);
  }

  to{
    transform:
      translate3d(75px,-95px,0)
      scale(1.035);
  }
}

@keyframes float3{

  from{
    transform:
      translate3d(18px,45px,0)
      scale(.97);
  }

  to{
    transform:
      translate3d(-65px,-92px,0)
      scale(1.04);
  }
}

@keyframes float4{

  from{
    transform:
      translate3d(-20px,40px,0);
  }

  to{
    transform:
      translate3d(58px,-80px,0);
  }
}

@keyframes float5{

  from{
    transform:
      translate3d(15px,32px,0);
  }

  to{
    transform:
      translate3d(-43px,-72px,0);
  }
}

@keyframes float6{

  from{
    transform:
      translate3d(-12px,25px,0);
  }

  to{
    transform:
      translate3d(39px,-66px,0);
  }
}

@keyframes float7{

  from{
    transform:
      translate3d(0,22px,0);
  }

  to{
    transform:
      translate3d(33px,-58px,0);
  }
}


/* очень лёгкая игра радужной плёнки */

@keyframes shine{

  from{
    filter:
      brightness(.98)
      saturate(.92);

    opacity:.72;
  }

  to{
    filter:
      brightness(1.12)
      saturate(1.10);

    opacity:.90;
  }
}


/* ========================================
   МОБИЛЬНАЯ ВЕРСИЯ
   ======================================== */

@media(max-width:900px){

  .hero{
    min-height:760px;
  }

  .hero-bg{
    background-position:
      67% center;
  }

  .left-light{
    width:82%;
    min-width:0;
  }

  .logo2k{
    left:6vw;
    top:4vh;
    width:82px;
  }

  .category{
    left:6vw;
    top:30vh;

    font-size:16px;
    letter-spacing:.13em;
  }

  .title{
    left:6vw;
    top:38vh;

    font-size:55px;
  }

  .ornament{
    left:6vw;
    top:49vh;

    width:68vw;
  }

  .descriptor{
    left:6vw;
    top:53vh;

    max-width:72vw;

    white-space:normal;

    font-size:13px;
    line-height:1.5;
  }

  .brands{
    left:6vw;

    top:auto;
    bottom:10vh;

    gap:17px;
  }

  .brand-wrap{
    height:50px;
  }

  .galax{
    height:37px;
  }

  .washfree{
    height:43px;
  }

  .prowash{
    height:41px;
  }

  .brand-wrap + .brand-wrap::before{
    display:none;
  }

  .scroll{
    display:none;
  }
}

</style>
</head>


<body>

<main class="hero" id="hero">

  <div class="hero-bg"></div>

  <div class="left-light"></div>

  <div class="light-sweep"></div>


  <!-- ДВИЖУЩИЕСЯ ГЛАМУРНЫЕ ПУЗЫРИ -->

  <div
    class="bubble-field"
    id="bubbleField"
  >

    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>
    <div class="bubble b4"></div>
    <div class="bubble b5"></div>
    <div class="bubble b6"></div>
    <div class="bubble b7"></div>

  </div>


  <section class="content">

    <img
      class="logo2k"
      src="assets/2K_logo%20(7).png"
      alt="2K"
    >


    <div class="category">

      <span>
        HOUSE CARE
      </span>

      <span
        class="category-dot"
      ></span>

      <span>
        2026
      </span>

    </div>


    <h1 class="title">
      НОВИНКИ
    </h1>


    <div class="ornament">

      <span
        class="ornament-line"
      ></span>

      <span
        class="ornament-star"
      >
        ✦
      </span>

      <span
        class="ornament-line"
      ></span>

    </div>


    <div class="descriptor">

      НОВІ ФОРМУЛИ. НОВІ АРОМАТИ. НОВІ РІШЕННЯ ДЛЯ ДОМУ.

    </div>


    <div class="brands">


      <div class="brand-wrap">

        <img
          class="brand galax"
          src="assets/galax-logo.png"
          alt="GALAX"
        >

      </div>


      <div class="brand-wrap">

        <img
          class="brand washfree"
          src="assets/washfree-logo.png"
          alt="WASH & FREE"
        >

      </div>


      <div class="brand-wrap">

        <img
          class="brand prowash"
          src="assets/prowash-logo-full.png"
          alt="PRO WASH"
        >

      </div>


    </div>


    <div class="scroll">

      <span
        class="scroll-line"
      ></span>

      <span>
        ГОРТАЙТЕ НИЖЧЕ
      </span>

    </div>

  </section>

</main>


<script>

const hero =
  document.getElementById("hero");

const bubbleField =
  document.getElementById("bubbleField");


hero.addEventListener(
  "mousemove",
  (event) => {

    const x =
      event.clientX /
      window.innerWidth - 0.5;

    const y =
      event.clientY /
      window.innerHeight - 0.5;


    bubbleField.style.transform =
      `translate3d(
        ${x * -18}px,
        ${y * -13}px,
        0
      )`;

  }
);


hero.addEventListener(
  "mouseleave",
  () => {

    bubbleField.style.transform =
      "translate3d(0,0,0)";

  }
);

</script>

</body>
</html>
