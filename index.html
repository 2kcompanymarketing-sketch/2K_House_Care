<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2K House Care — 2026</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: #eaf5fb;
      color: #111;
      overflow-x: hidden;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 720px;
      overflow: hidden;
      background: #dceef8;
    }

    /* ФОТО — НЕ МЕНЯЕМ */
    .hero-photo {
      position: absolute;
      inset: 0;
      background-image: url("assets/hero-laundry.png");
      background-size: cover;
      background-position: center center;
      transform: scale(1.015);
      transition: transform 7s ease;
      z-index: 1;
    }

    /* Лёгкое движение изображения */
    .hero:hover .hero-photo {
      transform: scale(1.035);
    }

    /* Только деликатная подложка под текст.
       Не закрывает половину изображения жёсткой плашкой. */
    .text-atmosphere {
      position: absolute;
      z-index: 2;
      left: 0;
      top: 0;
      bottom: 0;
      width: 44%;
      background:
        linear-gradient(
          90deg,
          rgba(240,248,253,.91) 0%,
          rgba(238,248,253,.78) 55%,
          rgba(238,248,253,.40) 80%,
          rgba(238,248,253,0) 100%
        );
      pointer-events: none;
    }

    /* дополнительный свет */
    .light-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        radial-gradient(
          circle at 42% 63%,
          rgba(255,255,255,.52) 0,
          rgba(255,255,255,.13) 9%,
          transparent 20%
        ),
        radial-gradient(
          circle at 68% 68%,
          rgba(255,255,255,.32) 0,
          transparent 15%
        );
      animation: shimmer 8s ease-in-out infinite alternate;
    }

    @keyframes shimmer {
      0% {
        opacity: .65;
        transform: translate3d(-1%,0,0);
      }
      100% {
        opacity: 1;
        transform: translate3d(1.5%,-.5%,0);
      }
    }

    .content {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
    }

    /* 2K */
    .company-logo {
      position: absolute;
      top: 6.5%;
      left: 4.2%;
      width: clamp(82px, 7.4vw, 132px);
      height: auto;
      object-fit: contain;
      filter: grayscale(1) brightness(0);
    }

    .copy {
      position: absolute;
      left: 4.25%;
      top: 31%;
      width: min(620px, 38vw);
    }

    .category {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: clamp(17px, 1.35vw, 25px);
      font-weight: 600;
      letter-spacing: .22em;
      color: #111;
      white-space: nowrap;
      margin-bottom: 25px;
    }

    .category-dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #111;
      flex: 0 0 auto;
    }

    .title {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(64px, 7vw, 124px);
      line-height: .9;
      font-weight: 500;
      letter-spacing: -.045em;
      color: #111;
      margin: 0;
    }

    .title-rule {
      width: 58px;
      height: 3px;
      background: rgba(15,136,202,.58);
      margin: 29px 0 23px;
    }

    .subline {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 13px;
      color: #111;
      font-size: clamp(14px, 1.12vw, 20px);
      font-weight: 500;
      letter-spacing: .035em;
      white-space: nowrap;
    }

    .subline span:not(.separator) {
      display: inline-block;
    }

    .separator {
      width: 18px;
      height: 1px;
      background: rgba(0,0,0,.42);
      flex: 0 0 auto;
    }

    /* ЛОГОТИПЫ ТМ */
    .brands {
      position: absolute;
      z-index: 11;
      left: 4.25%;
      bottom: 10.5%;
      display: flex;
      align-items: center;
      gap: clamp(25px, 2.5vw, 48px);
    }

    .brand {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 78px;
    }

    .brand + .brand::before {
      content: "";
      position: absolute;
      left: calc(clamp(25px, 2.5vw, 48px) / -2);
      top: 5%;
      width: 1px;
      height: 90%;
      background: rgba(48,139,195,.35);
    }

    .brand img {
      display: block;
      max-height: 100%;
      width: auto;
      object-fit: contain;
    }

    .brand-galax img {
      width: clamp(125px, 10vw, 185px);
    }

    .brand-washfree img {
      width: clamp(125px, 10vw, 180px);
    }

    .brand-prowash img {
      width: clamp(135px, 10.5vw, 195px);
    }

    /* ПУЗЫРЬКИ */
    .bubbles {
      position: absolute;
      inset: 0;
      z-index: 7;
      overflow: hidden;
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      opacity: .72;

      border: 1px solid rgba(255,255,255,.78);

      background:
        radial-gradient(
          circle at 28% 24%,
          rgba(255,255,255,.95) 0%,
          rgba(255,255,255,.42) 7%,
          transparent 17%
        ),
        radial-gradient(
          circle at 70% 75%,
          rgba(255,180,241,.30),
          transparent 30%
        ),
        radial-gradient(
          circle at 25% 78%,
          rgba(106,240,255,.30),
          transparent 34%
        ),
        linear-gradient(
          135deg,
          rgba(104,232,255,.17),
          rgba(255,255,255,.06) 35%,
          rgba(244,151,255,.18) 70%,
          rgba(255,220,148,.14)
        );

      box-shadow:
        inset -5px -7px 15px rgba(136,98,255,.14),
        inset 6px 5px 16px rgba(255,255,255,.25),
        0 0 16px rgba(164,232,255,.16);

      backdrop-filter: blur(.7px);

      animation:
        floatBubble var(--speed) ease-in-out infinite alternate,
        breatheBubble calc(var(--speed) * .55) ease-in-out infinite alternate;
    }

    .bubble::after {
      content: "";
      position: absolute;
      width: 23%;
      height: 12%;
      left: 20%;
      top: 14%;
      border-radius: 50%;
      background: rgba(255,255,255,.72);
      filter: blur(2px);
      transform: rotate(-30deg);
    }

    @keyframes floatBubble {
      0% {
        transform: translate3d(0, 18px, 0) rotate(0deg);
      }
      35% {
        transform: translate3d(11px, -15px, 0) rotate(2deg);
      }
      70% {
        transform: translate3d(-9px, -38px, 0) rotate(-2deg);
      }
      100% {
        transform: translate3d(13px, -68px, 0) rotate(3deg);
      }
    }

    @keyframes breatheBubble {
      from { filter: saturate(.95) brightness(.98); }
      to   { filter: saturate(1.22) brightness(1.08); }
    }

    .b1 {
      width: clamp(130px, 11vw, 205px);
      height: clamp(130px, 11vw, 205px);
      right: -2%;
      top: 16%;
      --speed: 8.5s;
    }

    .b2 {
      width: clamp(100px, 8.4vw, 155px);
      height: clamp(100px, 8.4vw, 155px);
      left: 48%;
      top: 5%;
      --speed: 9.5s;
    }

    .b3 {
      width: clamp(85px, 7.2vw, 132px);
      height: clamp(85px, 7.2vw, 132px);
      left: 51%;
      bottom: 13%;
      --speed: 7.7s;
    }

    .b4 {
      width: clamp(55px, 4.5vw, 84px);
      height: clamp(55px, 4.5vw, 84px);
      left: 44%;
      top: 29%;
      --speed: 6.8s;
    }

    .b5 {
      width: clamp(45px, 3.7vw, 70px);
      height: clamp(45px, 3.7vw, 70px);
      right: 20%;
      bottom: 20%;
      --speed: 6.2s;
    }

    .b6 {
      width: clamp(30px, 2.4vw, 46px);
      height: clamp(30px, 2.4vw, 46px);
      left: 55%;
      top: 42%;
      --speed: 5.7s;
    }

    .b7 {
      width: clamp(24px, 1.8vw, 35px);
      height: clamp(24px, 1.8vw, 35px);
      right: 10%;
      top: 8%;
      --speed: 5.2s;
    }

    .b8 {
      width: clamp(26px, 2vw, 38px);
      height: clamp(26px, 2vw, 38px);
      left: 59%;
      bottom: 7%;
      --speed: 5.9s;
    }

    /* небольшие световые точки */
    .spark {
      position: absolute;
      z-index: 6;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: white;
      box-shadow:
        0 0 7px rgba(255,255,255,.95),
        0 0 18px rgba(153,225,255,.9);
      opacity: .8;
      animation: sparkle 3.2s ease-in-out infinite alternate;
    }

    @keyframes sparkle {
      from {
        opacity: .25;
        transform: scale(.65);
      }
      to {
        opacity: 1;
        transform: scale(1.45);
      }
    }

    .s1 { left: 39%; top: 68%; }
    .s2 { left: 67%; top: 72%; animation-delay: .7s; }
    .s3 { right: 22%; top: 43%; animation-delay: 1.2s; }
    .s4 { right: 33%; bottom: 12%; animation-delay: 1.8s; }

    /* ГОРТАЙТЕ НИЖЧЕ */
    .scroll-hint {
      position: absolute;
      z-index: 12;
      left: 50%;
      bottom: 3.1%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 13px;
      color: rgba(17,17,17,.62);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .21em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .scroll-hint::before {
      content: "";
      width: 43px;
      height: 2px;
      background: rgba(29,153,218,.58);
    }

    .scroll-arrow {
      width: 7px;
      height: 7px;
      border-right: 1px solid rgba(17,17,17,.58);
      border-bottom: 1px solid rgba(17,17,17,.58);
      transform: rotate(45deg);
      margin-top: -4px;
      animation: arrowMove 1.8s ease-in-out infinite;
    }

    @keyframes arrowMove {
      0%, 100% {
        transform: translateY(-2px) rotate(45deg);
        opacity: .35;
      }
      50% {
        transform: translateY(4px) rotate(45deg);
        opacity: 1;
      }
    }

    /* следующий экран пока только как пространство для скролла */
    .next-section {
      min-height: 100vh;
      background: #f7fbfd;
    }

    @media (max-width: 1100px) {
      .text-atmosphere {
        width: 56%;
      }

      .copy {
        width: 48vw;
      }

      .category {
        letter-spacing: .16em;
      }

      .subline {
        white-space: normal;
        max-width: 450px;
      }
    }

    @media (max-width: 760px) {
      .hero {
        min-height: 760px;
      }

      .hero-photo {
        background-position: 61% center;
      }

      .text-atmosphere {
        width: 100%;
        background:
          linear-gradient(
            90deg,
            rgba(239,248,253,.94) 0%,
            rgba(239,248,253,.72) 58%,
            rgba(239,248,253,.18) 100%
          );
      }

      .company-logo {
        top: 5%;
        left: 6%;
        width: 80px;
      }

      .copy {
        left: 6%;
        top: 29%;
        width: 88%;
      }

      .category {
        font-size: 16px;
        gap: 10px;
        letter-spacing: .14em;
      }

      .title {
        font-size: clamp(62px, 18vw, 96px);
      }

      .subline {
        display: block;
        font-size: 15px;
        line-height: 1.7;
        max-width: 310px;
      }

      .separator {
        display: none;
      }

      .subline span:not(.separator) {
        display: block;
      }

      .brands {
        left: 6%;
        right: 6%;
        bottom: 9%;
        gap: 19px;
      }

      .brand {
        height: 55px;
      }

      .brand-galax img,
      .brand-washfree img,
      .brand-prowash img {
        width: 100px;
        max-width: 25vw;
      }

      .brand + .brand::before {
        left: -10px;
      }

      .scroll-hint {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bubble,
      .light-layer,
      .spark,
      .scroll-arrow {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <section class="hero" id="hero">

    <div class="hero-photo"></div>
    <div class="text-atmosphere"></div>
    <div class="light-layer"></div>

    <div class="bubbles" id="bubbles">
      <div class="bubble b1"></div>
      <div class="bubble b2"></div>
      <div class="bubble b3"></div>
      <div class="bubble b4"></div>
      <div class="bubble b5"></div>
      <div class="bubble b6"></div>
      <div class="bubble b7"></div>
      <div class="bubble b8"></div>
    </div>

    <span class="spark s1"></span>
    <span class="spark s2"></span>
    <span class="spark s3"></span>
    <span class="spark s4"></span>

    <div class="content">

      <img
        class="company-logo"
        src="assets/2K_logo (7).png"
        alt="2K"
      >

      <div class="copy">

        <div class="category">
          <span>HOUSE CARE</span>
          <span class="category-dot"></span>
          <span>2026</span>
        </div>

        <h1 class="title">НОВИНКИ</h1>

        <div class="title-rule"></div>

        <div class="subline">
          <span>Нові формули.</span>
          <span class="separator"></span>
          <span>Нові аромати.</span>
          <span class="separator"></span>
          <span>Нові рішення для дому.</span>
        </div>

      </div>

      <div class="brands">

        <div class="brand brand-galax">
          <img
            src="assets/galax-logo.png"
            alt="Galax"
          >
        </div>

        <div class="brand brand-washfree">
          <img
            src="assets/washfree-logo.png"
            alt="Wash & Free"
          >
        </div>

        <div class="brand brand-prowash">
          <img
            src="assets/prowash-logo-full.png"
            alt="ProWash"
          >
        </div>

      </div>

      <div class="scroll-hint">
        <span>Гортайте нижче</span>
        <span class="scroll-arrow"></span>
      </div>

    </div>
  </section>

  <section class="next-section"></section>

  <script>
    const hero = document.getElementById("hero");
    const bubbles = document.getElementById("bubbles");

    hero.addEventListener("mousemove", (event) => {
      const x = event.clientX / window.innerWidth - 0.5;
      const y = event.clientY / window.innerHeight - 0.5;

      bubbles.style.transform =
        `translate3d(${x * -14}px, ${y * -10}px, 0)`;
    });

    hero.addEventListener("mouseleave", () => {
      bubbles.style.transform = "translate3d(0,0,0)";
    });
  </script>

</body>
</html>
