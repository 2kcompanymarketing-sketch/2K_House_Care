<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2К House Care — Новинки 2026</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      font-family: "DM Sans", sans-serif;
      background: #dcecf5;
      color: #14232c;
    }

    .hero {
      position: relative;
      width: 100vw;
      height: 100svh;
      min-height: 720px;
      overflow: hidden;
      isolation: isolate;
    }

    /* =====================================================
       ОСНОВНОЙ ФОТОРЕАЛИСТИЧНЫЙ ВИЗУАЛ
       ===================================================== */

    .hero-photo {
      position: absolute;
      inset: -2.5%;
      z-index: 0;

      background-image: url("assets/hero-laundry.png");
      background-size: cover;
      background-position: center center;

      transform: scale(1.04);
      animation: cinematicMove 14s ease-in-out infinite alternate;
      will-change: transform;
    }

    @keyframes cinematicMove {
      0% {
        transform: scale(1.04) translate3d(0, 0, 0);
      }

      100% {
        transform: scale(1.085) translate3d(-0.7%, -0.5%, 0);
      }
    }

    /* =====================================================
       ЗАКРЫВАЕМ НАРИСОВАННЫЕ В КАРТИНКЕ ЛОГО И ТЕКСТ
       И СОЗДАЁМ ДОРОГУЮ СТЕКЛЯННУЮ ЗОНУ
       ===================================================== */

    .left-veil {
      position: absolute;
      inset: 0 auto 0 0;
      width: 43%;
      z-index: 2;

      background:
        linear-gradient(
          90deg,
          rgba(226, 240, 248, 0.94) 0%,
          rgba(226, 240, 248, 0.82) 46%,
          rgba(226, 240, 248, 0.44) 78%,
          rgba(226, 240, 248, 0) 100%
        );

      backdrop-filter: blur(11px);
      -webkit-backdrop-filter: blur(11px);
    }

    .left-veil::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at 18% 34%,
          rgba(255,255,255,.68),
          transparent 40%
        );

      pointer-events: none;
    }

    /* =====================================================
       ЖИВОЙ СВЕТ
       ===================================================== */

    .light-play {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      overflow: hidden;
      mix-blend-mode: screen;
    }

    .light-play::before {
      content: "";
      position: absolute;
      width: 54vw;
      height: 120vh;
      top: -25vh;
      left: 34vw;

      background:
        linear-gradient(
          112deg,
          transparent 16%,
          rgba(255,255,255,.03) 34%,
          rgba(255,255,255,.42) 49%,
          rgba(185,235,255,.18) 56%,
          transparent 73%
        );

      filter: blur(16px);
      transform: rotate(7deg);

      animation: lightSweep 8s ease-in-out infinite alternate;
    }

    @keyframes lightSweep {
      from {
        transform: translateX(-9vw) rotate(7deg);
        opacity: .45;
      }

      to {
        transform: translateX(16vw) rotate(7deg);
        opacity: .9;
      }
    }

    /* =====================================================
       РАДУЖНЫЕ ПУЗЫРИ — ДОПОЛНИТЕЛЬНАЯ ЖИВАЯ ГЛУБИНА
       ===================================================== */

    .bubble-layer {
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      overflow: hidden;
    }

    .bubble {
      position: absolute;
      border-radius: 50%;

      border:
        clamp(1px, .08vw, 2px)
        solid rgba(255,255,255,.68);

      background:
        radial-gradient(
          circle at 28% 20%,
          rgba(255,255,255,.98) 0%,
          rgba(255,255,255,.36) 6%,
          rgba(255,255,255,.02) 22%,
          rgba(255,255,255,.02) 58%,
          rgba(255,255,255,.16) 76%,
          rgba(255,255,255,.42) 100%
        );

      box-shadow:
        inset 10px 7px 24px rgba(255,255,255,.26),
        inset -12px -9px 28px rgba(69,198,255,.16),
        inset 14px -10px 24px rgba(238,89,255,.11),
        0 12px 38px rgba(58,119,153,.11);

      backdrop-filter: blur(1.5px) saturate(145%);
      -webkit-backdrop-filter: blur(1.5px) saturate(145%);

      opacity: .9;
      will-change: transform;
    }

    .bubble::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 50%;

      background:
        conic-gradient(
          from 18deg,
          rgba(255,255,255,.02),
          rgba(95,224,255,.56),
          rgba(120,114,255,.31),
          rgba(255,103,222,.44),
          rgba(255,208,105,.38),
          rgba(93,239,255,.44),
          rgba(255,255,255,.02)
        );

      mask:
        radial-gradient(
          farthest-side,
          transparent calc(100% - 7px),
          #000 calc(100% - 5px)
        );

      -webkit-mask:
        radial-gradient(
          farthest-side,
          transparent calc(100% - 7px),
          #000 calc(100% - 5px)
        );

      opacity: .9;
    }

    .bubble::after {
      content: "";
      position: absolute;
      width: 28%;
      height: 15%;
      top: 13%;
      left: 18%;
      border-radius: 50%;
      transform: rotate(-28deg);

      background: rgba(255,255,255,.88);
      filter: blur(5px);
    }

    .b1 {
      width: 235px;
      height: 235px;
      right: -58px;
      top: 7%;
      animation: bubbleOne 10s ease-in-out infinite alternate;
    }

    .b2 {
      width: 155px;
      height: 155px;
      right: 29%;
      top: 8%;
      animation: bubbleTwo 8.5s ease-in-out infinite alternate;
    }

    .b3 {
      width: 110px;
      height: 110px;
      right: 17%;
      bottom: 13%;
      animation: bubbleThree 9.5s ease-in-out infinite alternate;
    }

    .b4 {
      width: 82px;
      height: 82px;
      left: 40%;
      bottom: 12%;
      animation: bubbleFour 7.5s ease-in-out infinite alternate;
    }

    .b5 {
      width: 58px;
      height: 58px;
      right: 42%;
      top: 28%;
      animation: bubbleFive 6.5s ease-in-out infinite alternate;
    }

    .b6 {
      width: 38px;
      height: 38px;
      right: 8%;
      bottom: 7%;
      animation: bubbleSix 5.5s ease-in-out infinite alternate;
    }

    @keyframes bubbleOne {
      from {
        transform: translate3d(0, 50px, 0) rotate(0deg);
      }

      to {
        transform: translate3d(-70px, -85px, 0) rotate(8deg);
      }
    }

    @keyframes bubbleTwo {
      from {
        transform: translate3d(0, 40px, 0);
      }

      to {
        transform: translate3d(48px, -78px, 0);
      }
    }

    @keyframes bubbleThree {
      from {
        transform: translate3d(0, 35px, 0);
      }

      to {
        transform: translate3d(-46px, -92px, 0);
      }
    }

    @keyframes bubbleFour {
      from {
        transform: translate3d(-15px, 45px, 0);
      }

      to {
        transform: translate3d(35px, -80px, 0);
      }
    }

    @keyframes bubbleFive {
      from {
        transform: translate3d(0, 22px, 0);
      }

      to {
        transform: translate3d(22px, -62px, 0);
      }
    }

    @keyframes bubbleSix {
      from {
        transform: translate3d(0, 18px, 0);
      }

      to {
        transform: translate3d(-20px, -55px, 0);
      }
    }

    /* =====================================================
       НЕСКОЛЬКО МИКРОПУЗЫРЬКОВ
       ===================================================== */

    .micro {
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.78);
      background: rgba(255,255,255,.05);
      box-shadow: inset 1px 1px 3px white;
      opacity: .76;
      animation: microRise 5s linear infinite;
    }

    .m1 { left: 47%; top: 72%; animation-delay: 0s; }
    .m2 { left: 52%; top: 83%; animation-delay: 1.2s; }
    .m3 { left: 65%; top: 75%; animation-delay: 2.1s; }
    .m4 { left: 74%; top: 89%; animation-delay: 3s; }
    .m5 { left: 86%; top: 72%; animation-delay: .8s; }
    .m6 { left: 92%; top: 86%; animation-delay: 2.6s; }

    @keyframes microRise {
      0% {
        transform: translateY(60px) scale(.65);
        opacity: 0;
      }

      20% {
        opacity: .75;
      }

      100% {
        transform: translateY(-190px) scale(1.2);
        opacity: 0;
      }
    }

    /* =====================================================
       КОНТЕНТ
       ===================================================== */

    .content {
      position: relative;
      z-index: 20;
      height: 100%;
      padding:
        clamp(30px, 4vw, 70px)
        clamp(34px, 5vw, 88px);

      display: flex;
      flex-direction: column;
    }

    .logo-2k {
      width: clamp(100px, 8.2vw, 150px);
      height: auto;
      display: block;
      object-fit: contain;
    }

    .copy {
      margin-top: clamp(66px, 9vh, 110px);
      width: min(520px, 37vw);
    }

    .eyebrow {
      margin-bottom: 18px;

      font-size: 12px;
      font-weight: 600;
      letter-spacing: .23em;
      text-transform: uppercase;
      color: rgba(19,43,57,.56);
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(58px, 5.2vw, 94px);
      line-height: .96;
      font-weight: 500;
      letter-spacing: -.035em;
      color: #173443;
    }

    .lead {
      margin-top: 25px;
      max-width: 430px;

      font-size: clamp(14px, 1.05vw, 18px);
      line-height: 1.55;
      font-weight: 400;
      color: rgba(18,44,59,.68);
    }

    /* =====================================================
       БРЕНДЫ
       ===================================================== */

    .brands {
      margin-top: auto;
      width: fit-content;
      padding-bottom: 4px;
    }

    .brands-label {
      margin-bottom: 16px;

      font-size: 10px;
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(20,45,60,.46);
    }

    .brands-row {
      display: flex;
      align-items: center;
      gap: 33px;
    }

    .brand {
      display: block;
      width: auto;
      object-fit: contain;

      filter:
        drop-shadow(
          0 4px 12px rgba(255,255,255,.42)
        );

      transition:
        transform .4s ease,
        filter .4s ease;
    }

    .brand.galax {
      height: clamp(46px, 3.9vw, 67px);
    }

    .brand.wash {
      height: clamp(54px, 4.5vw, 78px);
    }

    .brand:hover {
      transform: translateY(-4px);
      filter:
        drop-shadow(
          0 8px 18px rgba(255,255,255,.72)
        );
    }

    /* =====================================================
       ЛЁГКИЙ PARALLAX
       ===================================================== */

    .hero-photo,
    .bubble-layer,
    .content {
      transition: transform .35s ease-out;
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 900px) {

      .hero {
        min-height: 100svh;
      }

      .hero-photo {
        background-position: 62% center;
      }

      .left-veil {
        width: 82%;
        background:
          linear-gradient(
            90deg,
            rgba(226,240,248,.93) 0%,
            rgba(226,240,248,.80) 58%,
            rgba(226,240,248,.08) 100%
          );
      }

      .content {
        padding: 28px 25px;
      }

      .logo-2k {
        width: 96px;
      }

      .copy {
        width: 78vw;
        margin-top: 80px;
      }

      h1 {
        font-size: 58px;
      }

      .lead {
        max-width: 315px;
      }

      .brands-row {
        gap: 22px;
      }

      .brand.galax {
        height: 42px;
      }

      .brand.wash {
        height: 52px;
      }

      .b1 {
        width: 180px;
        height: 180px;
      }

      .b2 {
        width: 112px;
        height: 112px;
      }
    }

  </style>
</head>

<body>

  <main class="hero" id="hero">

    <div class="hero-photo" id="heroPhoto"></div>

    <div class="left-veil"></div>

    <div class="light-play"></div>

    <div class="bubble-layer" id="bubbleLayer">

      <div class="bubble b1"></div>
      <div class="bubble b2"></div>
      <div class="bubble b3"></div>
      <div class="bubble b4"></div>
      <div class="bubble b5"></div>
      <div class="bubble b6"></div>

      <span class="micro m1"></span>
      <span class="micro m2"></span>
      <span class="micro m3"></span>
      <span class="micro m4"></span>
      <span class="micro m5"></span>
      <span class="micro m6"></span>

    </div>

    <section class="content" id="content">

      <img
        class="logo-2k"
        src="assets/2K_logo%20(7).png"
        alt="2К"
      >

      <div class="copy">

        <div class="eyebrow">
          HOUSE CARE · 2026
        </div>

        <h1>
          НОВИНКИ
        </h1>

        <p class="lead">
          Нові формули. Нові аромати.
          Нові рішення для дому.
        </p>

      </div>

      <div class="brands">

        <div class="brands-label">
          БРЕНДИ НОВИНОК
        </div>

        <div class="brands-row">

          <img
            class="brand galax"
            src="assets/galax-logo.png"
            alt="Galax"
          >

          <img
            class="brand wash"
            src="assets/washfree-logo.png"
            alt="Wash & Free"
          >

        </div>

      </div>

    </section>

  </main>


  <script>

    const hero =
      document.getElementById("hero");

    const photo =
      document.getElementById("heroPhoto");

    const bubbles =
      document.getElementById("bubbleLayer");


    hero.addEventListener(
      "mousemove",
      (event) => {

        const x =
          event.clientX / window.innerWidth - .5;

        const y =
          event.clientY / window.innerHeight - .5;


        photo.style.transform =
          `
          scale(1.065)
          translate3d(
            ${x * -9}px,
            ${y * -7}px,
            0
          )
          `;


        bubbles.style.transform =
          `
          translate3d(
            ${x * -18}px,
            ${y * -14}px,
            0
          )
          `;
      }
    );


    hero.addEventListener(
      "mouseleave",
      () => {

        photo.style.transform =
          "scale(1.055) translate3d(0,0,0)";

        bubbles.style.transform =
          "translate3d(0,0,0)";
      }
    );

  </script>

</body>
</html>
